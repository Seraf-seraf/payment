app:
  name: payment-service
  env: local
  mode: all

http:
  addr: ":8080"
  read_header_timeout: "5s"
  shutdown_timeout: "10s"

postgres:
  dsn: "postgres://payment:payment@localhost:5432/payment?sslmode=disable"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: "30m"

security:
  hmac_max_skew: "5m"
  encryption_key: ""

providers:
  cloudpayments:
    enabled: false
    api_url: "https://api.cloudpayments.ru"
    public_id: ""
    api_secret: ""
    test_mode: true
    timeout: "10s"
  default: mock
  mock:
    enabled: true
    webhook_secret: "change-me"
  tbank:
    enabled: false
    api_url: "https://securepay.tinkoff.ru/v2"
    terminal_key: ""
    password: ""
    notification_url: "https://example.com/api/v1/provider-webhooks/tbank"

invoices:
  enabled: false
  worker_enabled: true
  poll_interval: "60s"
  command_batch_size: 20
  command_lease: "60s"
  provider_timeout: "10s"
  max_attempts: 10
  reconcile_interval: "10m"
  expired_reconcile_interval: "24h"
  connections: []
  # connections:
  #   - id: "11111111-1111-4111-8111-111111111111"
  #     merchant_id: "22222222-2222-4222-8222-222222222222"
  #     provider_kind: mock_invoice
  #     evidence_mode: bank_credits
  #     creation_replay: provider_idempotent
  #     webhook_secret_env: PAYMENT_LOCAL_INVOICE_WEBHOOK_SECRET
  #     operation_id_strategy: shared_operation_id
  #     beneficiary:
  #       name: "Local mock beneficiary"
  #       inn: "7707654321"
  #       kpp: "770701001"
  #       account: "00000000000000000000"
  #       bank_bik: "000000000"
  #       bank_name: "Local mock bank"
  #       correspondent_account: "00000000000000000000"

outbox:
  enabled: true
  poll_interval: "1s"
  batch_size: 100
  max_attempts: 10
  worker_count: 1

callback:
  timeout: "5s"
